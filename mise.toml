[tools]
node = "24.21.0"
bun = "1.4.2"

[tasks.install]
description = "Install workspace dependencies from the lockfile"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Start the frontend and backend development servers"
run = "bun run dev"

[tasks.build]
description = "Build the Cloudflare Vite frontend"
run = "bun run --cwd frontend build"

[tasks.check]
description = "Run formatting and TypeScript checks"
run = [
  "bunx biome check .",
  "bunx tsc --project backend/tsconfig.json --noEmit",
  "bunx tsc --project frontend/tsconfig.app.json --noEmit",
]

[tasks.generate-api]
description = "Generate the OpenAPI document and Orval clients/mocks"
run = "bun run --cwd common generate:api"

[tasks.verify-generated-api]
description = "Ensure OpenAPI and generated API files are committed"
run = [
  "bun run --cwd common generate:api",
  "git diff --exit-code -- common/openapi.json common/generate",
]
